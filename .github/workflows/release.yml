name: release
# CD Sprint 1: tag v* -> CI lulus -> image backend ke GitHub Packages (ghcr).
# Belum deploy ke Railway; Sprint 1 diuji di server lokal (P-07 dokumen implementasi).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  image:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag harus sama dengan versi di openapi.yaml dan config.go
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qx "  version: $v" 04-Development/backend/api/openapi.yaml && grep -qF "\"APP_VERSION\", \"$v\"" 04-Development/backend/internal/pkg/config/config.go \
            || { echo "::error::tag $GITHUB_REF_NAME beda dengan versi di openapi.yaml/config.go"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hii-stranger-backend
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: 04-Development/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          provenance: false
