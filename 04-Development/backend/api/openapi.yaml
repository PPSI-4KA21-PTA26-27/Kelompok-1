openapi: 3.0.3

info:
  title: Hii Stranger Commerce API (Internal)
  version: 1.2.8
  license:
    name: Proprietary — seluruh hak dilindungi. Lihat berkas LICENSE di root repositori.
  x-confidentiality: internal
  description: |
    **RAHASIA — DOKUMEN INTERNAL HII STRANGER.** Spesifikasi ini adalah milik perusahaan dan tidak
    dilisensikan untuk publik. Dilarang menyalin, mempublikasikan, atau membagikan ke pihak ketiga
    tanpa izin tertulis. Format OpenAPI hanyalah standar penulisan; memakainya tidak membuat API ini
    open source.

    Kontrak REST API backend toko online. Skema disusun dari folder `migrations/`.

    ## Konvensi
    - Base path `/api/v1` (selalu mengarah ke versi terbaru). Versi lengkap juga dilayani di `/api/v<versi>` (mis. `/api/v1.2.8`); versi aktif ada di header `X-API-Version`. Body request dan response berformat JSON, kecuali upload dan unduh bukti pembayaran.
    - Response sukses dibungkus `{ "data": ..., "meta": ... }`. `meta` hanya ada pada response daftar.
    - Response error selalu berbentuk `{ "error": { "code", "message", "details" } }`.
      Detail internal (stack trace, SQL, secret) tidak pernah dikirim ke client.
    - Autentikasi memakai header `Authorization: Bearer <JWT>`. `user_id` dan `role` selalu diambil dari token,
      tidak pernah dari body request.
    - Peran: `public` (tanpa token), `customer`, `staff`, dan `owner` (tabel `roles`, dirujuk `users.role_id`).
      Role dibaca dari token, jadi perubahan role berlaku setelah user login ulang.
      - `customer`: satu-satunya role yang boleh memakai keranjang, cek ongkir, checkout, daftar order sendiri,
        membuat tagihan, dan mengunggah bukti bayar. Owner/staff ditolak 403 (ditegakkan di server).
      - `staff`: mengelola katalog, banner, pesanan, pembayaran, pengiriman, dan jurnal. Pengaturan situs,
        pengguna, dan analitik pendapatan hanya `owner`.
      - `owner`: seluruh hak `staff` ditambah kelola pengguna, pengaturan situs, dan analitik; tidak dapat berbelanja.
      Pada deskripsi endpoint, "admin" berarti `owner` atau `staff`.
      Resource milik user (cart, order, payment, shipment) hanya bisa diakses pemiliknya, staff, atau owner.
    - Mode maintenance ditegakkan server: saat `site_settings.maintenance_mode` aktif, semua request dijawab
      503 dengan `error.code = maintenance` dan `error.message` berisi `maintenance_message`, kecuali request
      dengan token `staff`/`owner` serta `GET /health`, `GET /site-settings`, `POST /auth/login`,
      `POST /auth/password/forgot`, `POST /auth/password/reset`, `POST /auth/verify-email`, dan `GET /users/me`.
      Perubahan status berlaku paling lambat 5 detik.
    - Rate limit: selain batas auth/publik yang tercantum per endpoint, semua endpoint terautentikasi dibatasi
      per user per menit (mutasi pelanggan 60, GET 120, upload gambar/bukti transfer 20, admin 120) dan
      menjawab 429 `too_many_requests` dengan header `Retry-After`.
    - Bila server sedang menangani terlalu banyak request bersamaan, semua endpoint kecuali `GET /health`
      dapat menjawab 503 dengan `error.code = server_busy` dan header `Retry-After`.
    - Checkout mewajibkan email terverifikasi (`email_verified_at` terisi); bila belum, server menjawab
      403 dengan `error.code = email_not_verified`.
    - Semua ID memakai UUID. `site_settings` hanya berisi satu baris (dijaga indeks unik), sehingga endpoint-nya tidak memakai ID.
    - Pagination memakai `page` (mulai dari 1) dan `limit` (default 20, maksimum 100).

    ## Catatan terkait skema database
    - Uang (`NUMERIC`) dikirim sebagai string desimal, misalnya `"150000"` atau `"150000.50"`, agar tidak ada
      kesalahan pembulatan. `discount_percent` dikirim sebagai angka biasa.
    - Waktu (`created_at`, `updated_at`, `payment_due_at`, dst.) dikirim dalam format RFC 3339 (UTC).
    - Kolom `role`, `status`, `availability_type`, `order_status`, `payment.status`, `coverage_status`,
      dan `shipping_status` adalah `TEXT`. `users.status` dan `posts.status` dibatasi CHECK constraint;
      `role` diambil dari tabel `roles` dan `banners.placement` dari tabel `banner_placements` (kode
      `hero`, `main`, `catalog`); nilai lain divalidasi aplikasi. Field `image_url` pada banner disimpan
      di kolom `desktop_image_url`.
    - Ongkir dihitung lewat RajaOngkir sampai tingkat kelurahan. Client memilih wilayah dari `/regions/...`,
      mengecek pilihan kurir di `/shipping/costs`, lalu mengirim ID wilayah + kurir saat checkout. Server
      menghitung ulang ongkir dan menyimpan nama wilayah di order.
    - Verifikasi email memakai tabel `email_verifications` (hanya hash SHA-256 token yang disimpan, berlaku
      24 jam, sekali pakai). Tidak ada refresh token; masa berlaku access token diatur `ACCESS_TOKEN_TTL`.
    - Pembayaran hanya QRIS statis toko. Tagihan dibuat saat pelanggan membuka informasi pembayaran, dengan nominal
      `total_amount + unique_code` (1–999). Order `pending_payment` yang melewati `payment_due_at` tanpa
      bukti yang sedang diverifikasi dibatalkan otomatis oleh server dan stoknya dikembalikan.
    - Respons GET publik (produk, kategori, banner, jurnal, pengaturan) di-cache maksimal 30 detik.

servers:
  - url: /api/v1
    description: Relatif terhadap host tempat API berjalan

tags:
  - name: System
    description: Pemeriksaan kesehatan layanan.
  - name: Auth
    description: Pendaftaran dan login.
  - name: Users
    description: Profil sendiri dan manajemen user oleh admin.
  - name: Categories
    description: Kategori produk.
  - name: Products
    description: Produk beserta varian dan gambarnya.
  - name: Banners
    description: Banner kampanye/event terjadwal (hero, utama, katalog).
  - name: Journal
    description: Artikel jurnal/blog. Publik membaca artikel terbit; admin & staff mengelola.
  - name: Admin
    description: Dashboard ringkasan operasional.
  - name: Uploads
    description: Unggah gambar ke Cloudinary (admin & staff).
  - name: Site Settings
    description: Pengaturan situs, termasuk mode maintenance.
  - name: Shipping
    description: Wilayah (provinsi, kota, kecamatan, kelurahan) dan cek ongkir via RajaOngkir.
  - name: Cart
    description: Keranjang belanja milik user.
  - name: Orders
    description: Checkout dan pengelolaan order.
  - name: Payments
    description: Pembayaran, bukti bayar, dan verifikasi admin.
  - name: Shipments
    description: Pengiriman order.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Cek kesehatan layanan
      description: "Hak akses: public."
      security: []
      responses:
        "200":
          description: Layanan berjalan.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        example: ok
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Daftar akun customer
      description: |
        Hak akses: public. Akun baru selalu berperan `customer`. Role tidak dapat ditentukan dari request.
        Email dinormalisasi (trim dan huruf kecil) sebelum disimpan.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Akun dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login dan dapatkan access token
      description: |
        Hak akses: public. Akun dengan status selain `active` ditolak. Pesan error untuk email tidak ditemukan
        dan password salah dibuat sama agar keberadaan akun tidak bocor.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login berhasil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  # --------------------------------------------------------------- Users
  /users/me:
    get:
      tags: [Users]
      operationId: getMyProfile
      summary: Profil user yang sedang login
      description: "Hak akses: semua user yang login."
      responses:
        "200":
          description: Profil user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Users]
      operationId: updateMyProfile
      summary: Ubah profil sendiri
      description: "Hak akses: semua user yang login. Email, role, dan status tidak dapat diubah lewat endpoint ini."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profil diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /users/me/password:
    put:
      tags: [Users]
      operationId: changeMyPassword
      summary: Ganti password sendiri
      description: "Hak akses: semua user yang login. Password lama wajib diverifikasi."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password diganti.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users:
    get:
      tags: [Users]
      operationId: adminListUsers
      summary: Daftar semua user
      description: "Hak akses: admin."
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          description: Cari berdasarkan nama atau email (mengandung teks, tidak peka huruf besar/kecil).
          schema:
            type: string
            maxLength: 100
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Daftar user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      operationId: adminGetUser
      summary: Detail user
      description: "Hak akses: admin."
      responses:
        "200":
          description: Detail user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Users]
      operationId: adminUpdateUser
      summary: Ubah role atau status user
      description: |
        Hak akses: admin. Admin tidak boleh menurunkan role atau menonaktifkan akunnya sendiri
        (ditolak dengan 409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateUserRequest"
      responses:
        "200":
          description: User diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------- Categories
  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: Daftar kategori
      description: |
        Hak akses: public. Secara default hanya kategori aktif (`is_active = true`) yang dikembalikan.
        Parameter `include_inactive=true` hanya berlaku untuk admin; selain admin menerima 403.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: include_inactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Daftar kategori, diurutkan berdasarkan nama.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Buat kategori
      description: "Hak akses: admin. Nama kategori harus unik."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Kategori dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Detail kategori
      description: "Hak akses: public. Kategori nonaktif hanya terlihat oleh admin (selain itu 404)."
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Detail kategori.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Categories]
      operationId: updateCategory
      summary: Ubah kategori
      description: "Hak akses: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Kategori diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Hapus kategori
      description: |
        Hak akses: admin. Produk yang memakai kategori ini tidak ikut terhapus; `category_id` produk menjadi
        `null` (ON DELETE SET NULL).
      responses:
        "204":
          description: Kategori dihapus.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ------------------------------------------------------------ Products
  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: Daftar produk
      description: |
        Hak akses: public. Pengguna non-admin hanya melihat produk yang berstatus tayang. Nilai status yang
        berarti "tayang" ditetapkan aplikasi. Parameter `status` hanya berlaku untuk admin.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: q
          in: query
          description: Cari berdasarkan nama produk (mengandung teks, tidak peka huruf besar/kecil).
          schema:
            type: string
            maxLength: 100
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: availability_type
          in: query
          schema:
            type: string
        - name: status
          in: query
          description: Hanya untuk admin.
          schema:
            type: string
        - name: min_price
          in: query
          schema:
            $ref: "#/components/schemas/Money"
        - name: max_price
          in: query
          schema:
            $ref: "#/components/schemas/Money"
        - name: sort
          in: query
          description: Awalan `-` berarti menurun. `newest` = produk terbaru dulu.
          schema:
            type: string
            enum: [name, -name, price, -price, newest]
            default: name
      responses:
        "200":
          description: Daftar produk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Products]
      operationId: createProduct
      summary: Buat produk
      description: |
        Hak akses: admin. Varian dan gambar ditambahkan lewat endpoint tersendiri.
        Jika `availability_type` adalah pre-order, `po_estimate_days` perlu diisi (aturan aplikasi).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Produk dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /products/{productId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [Products]
      operationId: getProduct
      summary: Detail produk beserta varian dan gambar
      description: "Hak akses: public. Produk yang belum tayang hanya terlihat oleh admin (selain itu 404)."
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Detail produk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Products]
      operationId: updateProduct
      summary: Ubah produk
      description: "Hak akses: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Produk diperbarui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Hapus produk
      description: |
        Hak akses: admin. Varian dan gambar ikut terhapus (CASCADE). Produk yang sudah pernah dipesan tidak dapat
        dihapus (order_items memakai RESTRICT) dan menghasilkan 409; ubah statusnya menjadi tidak tayang.
      responses:
        "204":
          description: Produk dihapus.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /products/{productId}/variants:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [Products]
      operationId: createProductVariant
      summary: Tambah varian produk
      description: "Hak akses: admin. SKU harus unik di seluruh produk."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantCreate"
      responses:
        "201":
          description: Varian dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /products/{productId}/variants/{variantId}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
