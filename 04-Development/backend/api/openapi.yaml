        berada di antara `starts_at` dan `ends_at` (bila diisi), diurutkan menurut `sort_order` naik.
        `include_inactive=true` (admin saja, selain admin 403) mengembalikan semua banner termasuk yang
        terjadwal, berakhir, dan nonaktif; field `status` menunjukkan kondisinya.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: placement
          in: query
          schema:
            $ref: "#/components/schemas/BannerPlacement"
        - name: include_inactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Daftar banner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Banners]
      operationId: createBanner
      summary: Buat banner
      description: "Hak akses: admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerCreate"
      responses:
        "201":
          description: Banner dibuat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /banners/{bannerId}:
